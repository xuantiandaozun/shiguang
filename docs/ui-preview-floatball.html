<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拾光 · 标志定稿</title>
  <style>
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:#f4f5f7; color:#1f2329; padding:28px 24px 40px; }
    h1 { margin:0 0 6px; font-size:20px; }
    .lead { margin:0 0 18px; max-width:720px; font-size:13px; color:#646a73; line-height:1.6; }
    .row { display:flex; align-items:flex-end; gap:20px; background:#fff; border:1px solid rgba(15,23,42,.08); border-radius:14px; padding:16px 18px; width:max-content; }
    .stage { margin-top:18px; max-width:860px; height:280px; border-radius:16px; position:relative; overflow:hidden; background:linear-gradient(180deg,#e7eef5,#cfd8e2); border:1px solid rgba(15,23,42,.08); }
    .stage em { position:absolute; left:16px; top:12px; font-size:12px; font-style:normal; color:#4b5563; }
    .ball { position:absolute; width:64px; height:64px; right:168px; bottom:72px; filter:drop-shadow(0 10px 16px rgba(15,23,42,.28)); }
    .cap { position:absolute; top:96px; width:28px; height:64px; overflow:hidden; }
    .cap.l { left:0; border-radius:0 32px 32px 0; }
    .cap.r { right:0; border-radius:32px 0 0 32px; }
    .cap svg { position:absolute; width:64px; height:64px; top:0; }
    .cap.l svg { left:-36px; }
    .cap.r svg { right:-36px; }
  </style>
</head>
<body>
  <h1>标志定稿 · B3 去射线</h1>
  <p class="lead">琥珀底、米白升起的光和托底，中心一点深琥珀。去掉上半射线。下面是 72 / 32 / 18，以及整球和左右贴边。</p>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="mark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#e8a23a"/>
      <path d="M14 36c6-14 30-14 36 0" fill="#f6c56a"/>
      <path d="M18 38c5 8 23 8 28 0" fill="#fff8ef"/>
      <circle cx="32" cy="24" r="8" fill="#fff8ef"/>
      <circle cx="32" cy="24" r="3.4" fill="#c98428"/>
    </symbol>
  </svg>

  <div class="row">
    <svg width="72" height="72"><use href="#mark"/></svg>
    <svg width="32" height="32"><use href="#mark"/></svg>
    <svg width="18" height="18"><use href="#mark"/></svg>
  </div>

  <div class="stage">
    <em>整球 · 左贴边 · 右贴边</em>
    <svg class="ball"><use href="#mark"/></svg>
    <div class="cap l"><svg><use href="#mark"/></svg></div>
    <div class="cap r"><svg><use href="#mark"/></svg></div>
  </div>
</body>
</html>
