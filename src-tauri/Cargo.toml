[package]
name = "shiguang"
version = "0.1.7"
description = "ShiGuang - AI desktop assistant for Windows"
edition = "2021"
rust-version = "1.85"
default-run = "shiguang"
autobins = false

[lib]
name = "shiguang_lib"
crate-type = ["rlib"]

# Speed up repeated local release builds; does not lower optimization level.
[profile.release]
incremental = true

[features]
default = ["desktop-client"]
desktop-client = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
futures-util = { version = "0.3", features = ["sink"] }
notify = "6.1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
chromiumoxide = "0.9"
tokio-tungstenite = "0.26"
tokio-util = "0.7"
base64 = "0.22"
pdf-extract = "0.12.0"
# PDF 合并/拆分/旋转（与 pdf-extract 用同一版本）
lopdf = { version = "0.42", default-features = false }
# Excel 读改写（保留原有格式）
umya-spreadsheet = "2.3"
tauri-plugin-dialog = "2.7.2"
rapidocr-core = "0.2.2"
trash = "5"
ssh2 = "0.9.6"
sha2 = "0.10"
sysinfo = "0.36.1"
rquickjs = "0.9"
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# UI Automation（桌面录屏识别点击的控件、桌面软件操控）；Windows.Data.Pdf（PDF 页面转图片）；版本与 Tauri 依赖的一致
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Foundation", "Data_Pdf", "Storage", "Storage_Streams"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[[bin]]
name = "shiguang"
path = "src/main.rs"
