<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.box{position:absolute;left:90px;bottom:150px;display:flex;align-items:stretch;font-family:"Microsoft YaHei",sans-serif;opacity:0;animation:in .6s cubic-bezier(.22,1,.36,1) .1s forwards, out .4s ease-in forwards;animation-delay:.1s, calc(var(--dur) - .45s)}
.accent{width:14px;background:{{color1|#ffb300}};border-radius:7px 0 0 7px}
.body{background:rgba(18,20,26,.88);padding:22px 40px 24px 30px;border-radius:0 14px 14px 0;color:#fff}
.t{font-size:46px;font-weight:700}
.s{font-size:30px;margin-top:6px;color:rgba(255,255,255,.75)}
.s:empty{display:none}
@keyframes in{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-60px)}}
</style></head><body>
<div class="box"><div class="accent"></div><div class="body"><div class="t">{{title}}</div><div class="s">{{subtitle}}</div></div></div>
<script>document.documentElement.style.setProperty('--dur', (window.SG_DURATION || 4) + 's');</script>
</body></html>
