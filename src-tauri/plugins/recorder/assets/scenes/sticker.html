<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.s{position:absolute;opacity:0;font-family:"ZCOOL KuaiLe","ZCOOL QingKe HuangYou","Microsoft YaHei",sans-serif;font-size:130px;white-space:nowrap;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards, wob 1.2s ease-in-out infinite, out .3s ease-in forwards;animation-delay:0s,.5s,calc(var(--dur) - .3s)}
/* 三层叠字：外层深色粗描边、白色描边、渐变填充 */
.s span{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.o{-webkit-text-stroke:28px #4a2300;color:#4a2300;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.w{-webkit-text-stroke:12px #fff;color:#fff}
.f{background:linear-gradient(180deg,{{color1|#fff36b}},{{color2|#ff8a00}});-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-14deg)}to{opacity:1;transform:rotate(-4deg)}}
@keyframes wob{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
@keyframes out{to{opacity:0;transform:scale(1.3)}}
</style></head><body>
<div class="s" id="s"><span class="o"></span><span class="w"></span><span class="f"></span></div>
<script>
document.documentElement.style.setProperty('--dur', (window.SG_DURATION || 2.5) + 's');
const text = {{{text}}};
const el = document.getElementById('s');
el.querySelectorAll('span').forEach((s) => { s.textContent = text; });
const x = parseFloat({{{x}}}) || 0.5, y = parseFloat({{{y}}}) || 0.3;
el.style.left = (x * 100) + '%';
el.style.top = (y * 100) + '%';
</script>
</body></html>
