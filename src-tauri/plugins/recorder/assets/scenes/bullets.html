<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:linear-gradient(160deg,{{color1|#0f2027}},{{color2|#2c5364}});color:#fff;font-family:"Microsoft YaHei",sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 240px;box-sizing:border-box}
h1{font-family:"ZCOOL QingKe HuangYou","ZCOOL KuaiLe","Microsoft YaHei",sans-serif;font-weight:normal;font-size:100px;margin:0 0 56px;opacity:0;animation:in .6s cubic-bezier(.22,1,.36,1) .1s forwards}
.i{display:flex;align-items:center;font-size:52px;font-weight:600;margin:18px 0;opacity:0;animation:in .55s cubic-bezier(.34,1.56,.64,1) forwards}
.dot{flex:none;width:64px;height:64px;border-radius:18px;margin-right:32px;background:#ffd43b;color:#1b1b1b;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}
@keyframes in{from{opacity:0;transform:translateX(-80px) scale(.92)}to{opacity:1;transform:none}}
</style></head><body>
<h1>{{title}}</h1>
<div id="list"></div>
<script>
const items = {{{items}}}.split('|').map(s => s.trim()).filter(Boolean).slice(0, 6);
const list = document.getElementById('list');
items.forEach((text, i) => {
  const row = document.createElement('div');
  row.className = 'i';
  row.style.animationDelay = (0.6 + i * 0.55) + 's';
  row.innerHTML = '<span class="dot"></span><span></span>';
  row.firstChild.textContent = String(i + 1);
  row.lastChild.textContent = text;
  list.appendChild(row);
});
</script>
</body></html>
