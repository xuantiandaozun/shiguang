<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.wrap{position:absolute;opacity:0;animation:in .35s ease-out .05s forwards, out .3s ease-in forwards;animation-delay:.05s, calc(var(--dur) - .35s)}
.ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:8px solid {{color1|#ff3b6b}};box-sizing:border-box;animation:pulse 1.1s ease-out infinite}
.core{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:{{color1|#ff3b6b}}}
.label{position:absolute;left:84px;top:-40px;white-space:nowrap;background:{{color1|#ff3b6b}};color:#fff;font:700 38px "Microsoft YaHei",sans-serif;padding:12px 28px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.label.left{left:auto;right:84px}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0}}
</style></head><body>
<div class="wrap" id="w"><div class="ring"></div><div class="core"></div><div class="label" id="l">{{text}}</div></div>
<script>
document.documentElement.style.setProperty('--dur', (window.SG_DURATION || 3) + 's');
const x = parseFloat({{{x}}}) || 0.5, y = parseFloat({{{y}}}) || 0.5;
const w = document.getElementById('w');
w.style.left = (x * 100) + '%';
w.style.top = (y * 100) + '%';
// 靠右时文字放到圆圈左边
if (x > 0.65) document.getElementById('l').classList.add('left');
</script>
</body></html>
