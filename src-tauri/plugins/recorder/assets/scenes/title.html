<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:linear-gradient(135deg,{{color1|#6a5cff}},{{color2|#ff5fa2}});display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:"ZCOOL QingKe HuangYou","ZCOOL KuaiLe","Microsoft YaHei",sans-serif}
.t{font-size:150px;letter-spacing:8px;text-shadow:0 10px 0 rgba(0,0,0,.16),0 24px 50px rgba(0,0,0,.25);white-space:nowrap}
.t span{display:inline-block;opacity:0;animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards}
.s{margin-top:40px;font-size:50px;font-family:"Microsoft YaHei",sans-serif;font-weight:600;opacity:0;animation:rise .7s ease-out forwards}
.b{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);animation:float 5s ease-in-out infinite alternate}
@keyframes pop{0%{opacity:0;transform:translateY(80px) scale(.3) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{to{transform:translate(40px,-90px)}}
</style></head><body>
<div class="b" style="width:460px;height:460px;left:-140px;top:-120px"></div>
<div class="b" style="width:320px;height:320px;right:-70px;bottom:-70px;animation-duration:4s"></div>
<div class="b" style="width:120px;height:120px;right:22%;top:14%;animation-duration:3s"></div>
<div class="t" id="t"></div>
<div class="s" id="s">{{subtitle}}</div>
<script>
const title = {{{title}}};
const t = document.getElementById('t');
[...title].forEach((c, i) => {
  const s = document.createElement('span');
  s.textContent = c === ' ' ? ' ' : c;
  s.style.animationDelay = (0.15 + i * 0.07) + 's';
  t.appendChild(s);
});
document.getElementById('s').style.animationDelay = (0.45 + title.length * 0.07) + 's';
</script>
</body></html>
